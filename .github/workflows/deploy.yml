name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  # Gate the deploy on lint, type check and tests. `needs:` cannot reference a
  # job in another workflow file, so CI is invoked as a reusable workflow --
  # `needs: []` previously meant "no dependencies at all", and main shipped even
  # with the suite red.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: [ci]

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/c2c-e-commerce
      # Job-level on purpose — see the Railway step below.
      RAILWAY_DEPLOY_WEBHOOK: ${{ secrets.RAILWAY_DEPLOY_WEBHOOK }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Push to GitHub Container Registry ─────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./c2c-e-commerce
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Deploy to Railway ─────────────────────────────────────────────────
      # Railway supports deploy webhooks — trigger a redeploy after image push.
      # Set RAILWAY_DEPLOY_WEBHOOK secret in GitHub repo settings.
      # To get the webhook URL: Railway Dashboard → Project → Settings → Deploy Webhook
      # The webhook is declared as job-level env above, not on this step. The
      # `secrets` context is not available to a step's `if`, and a step's own
      # env is not reliably applied before its `if` is evaluated -- either would
      # make this condition always false and skip the deploy silently.
      - name: Trigger Railway deployment
        if: ${{ env.RAILWAY_DEPLOY_WEBHOOK != '' }}
        run: |
          curl -X POST "$RAILWAY_DEPLOY_WEBHOOK" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error
