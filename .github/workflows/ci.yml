name: CI

on:
  # main/master are covered by Deploy, which calls this workflow as a gate
  # before shipping; listing them here too would run lint and tests twice.
  push:
    branches: [develop]
  pull_request:
    branches: [main, master, develop]
  workflow_call:

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./c2c-e-commerce

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: testcontainers@12 requires >= 22.22, its bundled undici@8
          # requires >= 22.19, and @testing-library/jest-dom@7 requires >= 22. On
          # Node 20 npm warns EBADENGINE and installs anyway, then the suite dies at
          # import on `webidl.util.markAsUncloneable is not a function` -- undici
          # reaching for a worker_threads export Node 20 does not have.
          node-version: 22
          cache: npm
          cache-dependency-path: c2c-e-commerce/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./c2c-e-commerce
          push: false
          tags: c2c-e-commerce:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
